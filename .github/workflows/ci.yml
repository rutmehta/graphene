name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS)
    # Swift 6.2 ships with Xcode 26, and FoundationModels needs the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 40
    env:
      # Tests must never touch a real profile (see README, Verification).
      GRAPHENE_DATA_DIR: /tmp/graphene-ci-profile
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (debug)
        run: swift build

      - name: Test
        run: |
          mkdir -p "$GRAPHENE_DATA_DIR"
          swift test

      - name: Build (release)
        run: swift build -c release

      - name: Bundle and verify signature
        run: |
          ./scripts/build-app.sh
          codesign --verify --deep --strict .build/Graphene.app
